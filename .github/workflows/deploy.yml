# Gera o site e publica no GitHub Pages a cada envio para a branch main.
#
# Variáveis opcionais (Settings → Secrets and variables → Actions → Variables):
#   FORM_ENDPOINT  URL do app da Web do Google Apps Script (ver apps-script/LEIA-ME.md)
#   SITE_URL       endereço final, ex.: https://inplak.com.br (quando usar domínio próprio)

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar imagens novas (se alguma foto foi adicionada)
        run: |
          pip install --quiet "pillow>=11.2"
          python -P scripts/images.py

      - name: Testar o servidor do formulário (Apps Script)
        run: node scripts/test-apps-script.mjs

      - name: Gerar o site
        env:
          TARGET: github
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
